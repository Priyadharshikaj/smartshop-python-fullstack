{% extends "base.html" %}
{% block title %}Register | SmartShop{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create Account</h1>
    <p>Register as a new SmartShop customer.</p>
    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" minlength="6" required>
        <button class="primary-btn full">Register</button>
    </form>
    <p>Already registered? <a href="{{ url_for('main.login') }}">Login</a></p>
</div>
{% endblock %}
